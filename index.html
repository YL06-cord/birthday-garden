<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceaf4">
  <title>冬至将临，平安喜乐</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{position:relative;display:grid;place-items:center;overflow-x:hidden;background:linear-gradient(145deg,#d8e8f1 0%,#eef5f8 49%,#dbe7f0 100%);color:#43566a;font-family:Georgia,'Times New Roman','Microsoft YaHei',serif}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.7;background:radial-gradient(circle at 12% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 81% 16%,#fff 0 1px,transparent 2px),radial-gradient(circle at 23% 85%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 78%,#fff 0 1px,transparent 2px),linear-gradient(120deg,transparent 47%,#fff7 48% 49%,transparent 50%),linear-gradient(54deg,transparent 47%,#fff5 48% 49%,transparent 50%);background-size:170px 170px,210px 210px,190px 190px,230px 230px,290px 290px,340px 340px}
    .page{position:relative;width:min(100%,760px);min-height:100svh;display:grid;place-items:center;padding:clamp(38px,8vh,82px) 18px}
    .page::before,.page::after{content:'✦';position:absolute;color:#fff;opacity:.75;text-shadow:0 0 18px #9ab8cc;font-size:clamp(22px,5vw,42px)}
    .page::before{top:8%;left:8%;transform:rotate(-16deg)}
    .page::after{right:8%;bottom:9%;transform:rotate(17deg);font-size:clamp(16px,4vw,32px)}
    .blessing{width:min(100%,650px);text-align:center}
    .eyebrow{margin:0 0 13px;color:#718ba0;font-size:11px;letter-spacing:4px}
    .blessing h1{margin:0;color:#415a70;font-size:clamp(23px,5.2vw,40px);font-weight:400;letter-spacing:5px;line-height:1.35;text-shadow:0 2px 15px #fff}
    .blessing-line{width:92px;height:1px;margin:20px auto 24px;background:linear-gradient(90deg,transparent,#86a9bf,transparent)}
    .video-card{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:8px solid #f5fbfdcc;border-radius:18px;background:#d4e4ed;box-shadow:0 24px 52px #66869d38,0 0 0 1px #fff8,0 0 42px #fff8}
    .video-card::before{content:'';position:absolute;z-index:2;inset:7px;border:1px solid #ffffffaa;border-radius:10px;pointer-events:none}
    video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#d4e4ed}
    .footer{margin:22px 0 0;color:#6e8597;font-size:12px;letter-spacing:2px}
    @media(max-width:520px){.page{padding:42px 12px}.eyebrow{font-size:9px;letter-spacing:3px}.blessing h1{font-size:24px;letter-spacing:3px}.video-card{border-width:6px;border-radius:14px}.footer{font-size:10px;letter-spacing:1.4px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="blessing" aria-label="冬至祝福视频">
      <p class="eyebrow">WINTER SOLSTICE · A LITTLE BLESSING</p>
      <h1>冬至将临，平安喜乐</h1>
      <div class="blessing-line" aria-hidden="true"></div>
      <div class="video-card">
        <video controls playsinline autoplay muted loop preload="metadata" poster="winter-poster.webp" aria-label="冬至祝福视频">
          <source src="winter-garden.mp4" type="video/mp4">
        </video>
      </div>
      <p class="footer">祝你 · 祝我 · 祝我们</p>
    </section>
  </main>
</body>
</html>
